<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a10">
    <title>MouseLocator – Never Lose Your Cursor Again</title>

    <style>
        :root {
            --text: #f5f7fb;
            --muted: #9da6b8;
            --blue: #5aa2ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 12%, rgba(53, 105, 255, 0.12), transparent 28rem),
                radial-gradient(circle at 88% 24%, rgba(244, 63, 94, 0.08), transparent 26rem),
                linear-gradient(135deg, #080a10 0%, #111622 52%, #080a10 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        .container {
            width: min(1100px, calc(100% - 48px));
            margin: 0 auto;
        }

        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient::before,
        .ambient::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.16;
        }

        .ambient::before {
            top: 18%;
            left: -180px;
            background: #2563eb;
        }

        .ambient::after {
            right: -190px;
            bottom: 10%;
            background: #dc2626;
        }

        /* Floating colorful cursor icons */
        .cursor-icon {
            position: absolute;
            z-index: 3;
            width: 48px;
            height: 48px;
            color: white;
            opacity: 0.2;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.3s ease, filter 0.3s ease;
            animation: float 7s ease-in-out infinite;
        }

        .cursor-icon:hover {
            opacity: 1;
            animation:
                rainbow-glow 2s linear infinite,
                float 4s ease-in-out infinite;
        }

        .cursor-icon-1 { top: 12%; left: 6%; width: 56px; height: 56px; }
        .cursor-icon-2 { top: 22%; right: 8%; animation-delay: -1s; }
        .cursor-icon-3 { bottom: 25%; left: 8%; width: 52px; height: 52px; animation-delay: -2s; }
        .cursor-icon-4 { bottom: 18%; right: 6%; width: 60px; height: 60px; animation-delay: -0.5s; }
        .cursor-icon-5 { top: 45%; left: 3%; width: 44px; height: 44px; animation-delay: -1.5s; }
        .cursor-icon-6 { top: 50%; right: 4%; width: 50px; height: 50px; animation-delay: -2.5s; }
        .cursor-icon-7 { top: 8%; right: 25%; width: 42px; height: 42px; animation-delay: -0.8s; }
        .cursor-icon-8 { bottom: 8%; left: 30%; animation-delay: -1.8s; }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0);
            }

            50% {
                transform: translate(8px, -18px) rotate(5deg);
            }
        }

        @keyframes rainbow-glow {
            0% {
                color: #ff3b30;
                filter: drop-shadow(0 0 12px #ff3b30);
            }

            25% {
                color: #ffd60a;
                filter: drop-shadow(0 0 12px #ffd60a);
            }

            50% {
                color: #30d158;
                filter: drop-shadow(0 0 12px #30d158);
            }

            75% {
                color: #0a84ff;
                filter: drop-shadow(0 0 12px #0a84ff);
            }

            100% {
                color: #bf5af2;
                filter: drop-shadow(0 0 12px #bf5af2);
            }
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 24px 70px;
            overflow: hidden;
            isolation: isolate;
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 180px;
            z-index: -1;
            background: linear-gradient(to bottom, transparent, #080a10);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 5;
            width: min(800px, 100%);
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            padding: 7px 13px;
            border: 1px solid rgba(90, 162, 255, 0.28);
            border-radius: 999px;
            color: #a9ccff;
            background: rgba(31, 83, 170, 0.14);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #49e28f;
            box-shadow: 0 0 14px #49e28f;
        }

        h1 {
            max-width: 780px;
            margin: 0 auto 24px;
            color: #ffffff;
            font-size: clamp(2.7rem, 8vw, 5.5rem);
            font-weight: 780;
            letter-spacing: -0.065em;
            line-height: 0.98;
        }

        .hero-subtitle {
            max-width: 680px;
            margin: 0 auto 40px;
            color: var(--muted);
            font-size: clamp(1rem, 2.5vw, 1.22rem);
            line-height: 1.7;
        }

        .hero-subtitle strong {
            color: #b9d6ff;
            font-weight: 700;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-bottom: 42px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 700;
            text-decoration: none;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button-primary {
            min-width: 225px;
            color: white;
            background: linear-gradient(135deg, #5ba5ff, #246be6);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.3);
        }

        .button-primary:hover {
            box-shadow: 0 17px 38px rgba(37, 99, 235, 0.46);
        }

        .button-secondary {
            min-width: 190px;
            color: #eaf1ff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.05);
        }

        .button-secondary:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.09);
        }

        /* Fast cursor rockets */
        .cursor-rocket {
            position: absolute;
            z-index: 4;
            width: 34px;
            height: 45px;
            pointer-events: none;
            filter: drop-shadow(0 0 7px rgba(115, 183, 255, 0.85));
            animation: cursor-rocket-flight 4.8s linear infinite;
        }

        .cursor-rocket::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(
                4% 0%,
                94% 65%,
                57% 68%,
                77% 99%,
                60% 100%,
                42% 70%,
                18% 94%
            );
            background: #ffffff;
        }

        .cursor-rocket::after {
            content: "";
            position: absolute;
            inset: 3px 3px 4px 4px;
            clip-path: polygon(
                4% 0%,
                94% 65%,
                57% 68%,
                77% 99%,
                60% 100%,
                42% 70%,
                18% 94%
            );
            background: linear-gradient(145deg, #7dc2ff, #3569e8 52%, #734bd4);
        }

        .cursor-rocket .flame {
            position: absolute;
            z-index: -1;
            left: -42px;
            top: 24px;
            width: 52px;
            height: 16px;
            border-radius: 50% 0 0 50%;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff3b30 24%,
                    #ff8c42 52%,
                    #ffe58a 82%,
                    transparent
                );
            filter: blur(2px);
            transform: rotate(7deg);
            transform-origin: right center;
            animation: cursor-flame 0.14s ease-in-out infinite alternate;
        }

        .cursor-rocket .flame::before,
        .cursor-rocket .flame::after {
            content: "";
            position: absolute;
            right: 5px;
            border-radius: 50% 0 0 50%;
            transform-origin: right center;
        }

        .cursor-rocket .flame::before {
            top: -5px;
            width: 38px;
            height: 9px;
            background: linear-gradient(90deg, transparent, #ff4f35, #ffd15c);
            filter: blur(2px);
        }

        .cursor-rocket .flame::after {
            top: 12px;
            width: 31px;
            height: 7px;
            background: linear-gradient(90deg, transparent, #ff6b35, #ffdd70);
            filter: blur(2px);
        }

        .cursor-rocket .spark {
            position: absolute;
            left: -48px;
            top: 30px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffd166;
            box-shadow: 0 0 9px #ff9f43;
            animation: rocket-spark 0.75s linear infinite;
        }

        .cursor-rocket .spark.two {
            top: 16px;
            left: -30px;
            width: 3px;
            height: 3px;
            animation-delay: -0.35s;
        }

        .cursor-rocket.r1 {
            top: 15%;
            left: -80px;
            animation-delay: -0.8s;
        }

        .cursor-rocket.r2 {
            top: 32%;
            left: -120px;
            transform: scale(0.75);
            animation-delay: -2.7s;
        }

        .cursor-rocket.r3 {
            top: 57%;
            left: -100px;
            transform: scale(0.62);
            animation-delay: -1.9s;
        }

        .cursor-rocket.r4 {
            top: 76%;
            left: -130px;
            transform: scale(0.88);
            animation-delay: -4s;
        }

        .cursor-rocket.r5 {
            top: 44%;
            left: -90px;
            transform: scale(0.55);
            animation-delay: -3.5s;
        }

        @keyframes cursor-rocket-flight {
            0% {
                left: -100px;
                opacity: 0;
                transform: translateY(30px) rotate(-18deg);
            }

            7% {
                opacity: 1;
            }

            23% {
                transform: translateY(-28px) rotate(-11deg);
            }

            48% {
                transform: translateY(19px) rotate(-20deg);
            }

            73% {
                transform: translateY(-34px) rotate(-12deg);
                opacity: 1;
            }

            94% {
                opacity: 0.85;
            }

            100% {
                left: calc(100% + 100px);
                opacity: 0;
                transform: translateY(25px) rotate(-18deg);
            }
        }

        @keyframes cursor-flame {
            from {
                width: 40px;
                opacity: 0.7;
                transform: rotate(7deg) scaleY(0.8);
            }

            to {
                width: 62px;
                opacity: 1;
                transform: rotate(7deg) scaleY(1.18);
            }
        }

        @keyframes rocket-spark {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.4);
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(-34px, 10px) scale(0.1);
            }
        }

        /* Red carpet scene */
        .carpet-scene {
            position: relative;
            width: min(580px, 94vw);
            height: 230px;
            margin: 0 auto;
            perspective: 700px;
        }

        .carpet {
            position: absolute;
            left: 6%;
            right: 6%;
            bottom: 13px;
            height: 92px;
            border: 1px solid rgba(255, 176, 176, 0.3);
            border-radius: 12px 12px 5px 5px;
            transform: rotateX(52deg);
            transform-origin: bottom;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 28px,
                    rgba(255, 255, 255, 0.045) 29px,
                    transparent 30px
                ),
                linear-gradient(90deg, #55151d, #d0293b 50%, #55151d);
            box-shadow:
                0 16px 0 #47111a,
                0 23px 26px rgba(0, 0, 0, 0.5),
                inset 0 0 32px rgba(0, 0, 0, 0.4);
        }

        .carpet::before,
        .carpet::after {
            content: "";
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 13px;
            border-radius: 4px;
            background: linear-gradient(#f5c36b, #9a571d, #f5c36b);
            box-shadow: 0 0 12px rgba(245, 195, 107, 0.2);
        }

        .carpet::before {
            left: -16px;
        }

        .carpet::after {
            right: -16px;
        }

        .carpet-label {
            position: absolute;
            right: 2%;
            bottom: 0;
            z-index: 8;
            padding: 3px 8px;
            transform: rotate(-8deg);
            color: #ffd6d6;
            border: 1px solid rgba(255, 214, 214, 0.25);
            border-radius: 4px;
            background: rgba(70, 7, 16, 0.75);
            font-size: 0.63rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Cursors moving across and landing on the carpet */
        .carpet-cursor {
            position: absolute;
            z-index: 9;
            width: 25px;
            height: 35px;
            pointer-events: none;
            filter: drop-shadow(0 5px 4px rgba(0, 0, 0, 0.45));
        }

        .carpet-cursor::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(
                5% 2%,
                91% 65%,
                57% 67%,
                75% 97%,
                61% 100%,
                43% 70%,
                20% 92%
            );
            background: #ffffff;
        }

        .carpet-cursor::after {
            content: "";
            position: absolute;
            inset: 3px;
            clip-path: polygon(
                5% 2%,
                91% 65%,
                57% 67%,
                75% 97%,
                61% 100%,
                43% 70%,
                20% 92%
            );
            background: linear-gradient(135deg, #4ca3ff, #8e4de8);
        }

        .carpet-cursor.running-one {
            left: 11%;
            bottom: 72px;
            animation: carpet-run-one 5.2s ease-in-out infinite;
        }

        .carpet-cursor.running-two {
            left: 17%;
            bottom: 45px;
            animation: carpet-run-two 6.3s ease-in-out infinite;
        }

        .carpet-cursor.running-three {
            left: 9%;
            bottom: 60px;
            animation: carpet-run-three 7s ease-in-out infinite;
        }

        .carpet-cursor.placed-one {
            left: 44%;
            bottom: 52px;
            animation: place-cursor-one 5.5s ease-in-out infinite;
        }

        .carpet-cursor.placed-two {
            left: 56%;
            bottom: 48px;
            animation: place-cursor-two 6.2s ease-in-out infinite;
        }

        @keyframes carpet-run-one {
            0% {
                left: 8%;
                bottom: 75px;
                transform: rotate(-20deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            45% {
                left: 43%;
                bottom: 48px;
                transform: rotate(7deg);
            }

            72% {
                left: 72%;
                bottom: 61px;
                transform: rotate(-10deg);
                opacity: 1;
            }

            100% {
                left: 92%;
                bottom: 43px;
                transform: rotate(15deg);
                opacity: 0;
            }
        }

        @keyframes carpet-run-two {
            0% {
                left: 9%;
                bottom: 42px;
                transform: rotate(15deg) scale(0.72);
                opacity: 0;
            }

            12% {
                opacity: 1;
            }

            38% {
                left: 31%;
                bottom: 66px;
                transform: rotate(-13deg) scale(0.72);
            }

            67% {
                left: 65%;
                bottom: 40px;
                transform: rotate(10deg) scale(0.72);
            }

            100% {
                left: 95%;
                bottom: 70px;
                transform: rotate(-18deg) scale(0.72);
                opacity: 0;
            }
        }

        @keyframes carpet-run-three {
            0% {
                left: 8%;
                bottom: 57px;
                transform: rotate(-8deg) scale(0.58);
                opacity: 0;
            }

            14% {
                opacity: 0.9;
            }

            50% {
                left: 54%;
                bottom: 74px;
                transform: rotate(14deg) scale(0.58);
            }

            100% {
                left: 94%;
                bottom: 52px;
                transform: rotate(-12deg) scale(0.58);
                opacity: 0;
            }
        }

        @keyframes place-cursor-one {
            0%, 17% {
                transform: translate(-82px, -45px) rotate(12deg);
                opacity: 0;
            }

            28% {
                opacity: 1;
            }

            48%, 72% {
                transform: translate(0, 0) rotate(12deg);
                opacity: 1;
            }

            100% {
                transform: translate(0, 0) rotate(12deg);
                opacity: 0.85;
            }
        }

        @keyframes place-cursor-two {
            0%, 22% {
                transform: translate(78px, -52px) rotate(-15deg);
                opacity: 0;
            }

            34% {
                opacity: 1;
            }

            52%, 76% {
                transform: translate(0, 0) rotate(-15deg);
                opacity: 1;
            }

            100% {
                transform: translate(0, 0) rotate(-15deg);
                opacity: 0.85;
            }
        }

        /* Human-like cartoon boys */
        .boy {
            position: absolute;
            z-index: 7;
            bottom: 51px;
            width: 92px;
            height: 145px;
            animation: boy-bounce 2.4s ease-in-out infinite;
        }

        .boy.left {
            left: 6%;
        }

        .boy.right {
            right: 6%;
            animation-delay: -1.2s;
        }

        .boy-head {
            position: absolute;
            top: 5px;
            left: 30px;
            width: 42px;
            height: 45px;
            border: 2px solid rgba(0, 0, 0, 0.45);
            border-radius: 48% 48% 45% 45%;
            background: #d89469;
            box-shadow: inset -7px -4px 0 rgba(113, 53, 43, 0.16);
        }

        .boy-head::before {
            content: "";
            position: absolute;
            top: -7px;
            left: -2px;
            width: 45px;
            height: 18px;
            border-radius: 60% 55% 35% 30%;
            background: #3b241f;
            transform: rotate(-7deg);
        }

        .boy-head::after {
            content: "•  •";
            position: absolute;
            top: 20px;
            left: 9px;
            color: #261719;
            font-size: 9px;
            letter-spacing: 6px;
            white-space: nowrap;
        }

        .boy-ear {
            position: absolute;
            top: 24px;
            width: 8px;
            height: 12px;
            border-radius: 50%;
            background: #c47a5d;
        }

        .boy-ear.left-ear {
            left: 25px;
        }

        .boy-ear.right-ear {
            right: 17px;
        }

        .boy-body {
            position: absolute;
            top: 52px;
            left: 19px;
            width: 63px;
            height: 59px;
            border: 2px solid rgba(0, 0, 0, 0.25);
            border-radius: 22px 22px 9px 9px;
            background: linear-gradient(135deg, #347ee7, #19439a);
        }

        .boy-body::before {
            content: "M";
            position: absolute;
            top: 17px;
            left: 22px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 20px;
            font-weight: 900;
        }

        .boy-arm {
            position: absolute;
            top: 58px;
            width: 15px;
            height: 62px;
            border-radius: 12px;
            background: #d89469;
            transform-origin: top center;
        }

        .boy.left .boy-arm.left-arm {
            left: 10px;
            animation: left-throwing-arm 2.8s ease-in-out infinite;
        }

        .boy.left .boy-arm.right-arm {
            right: 4px;
            animation: left-catching-arm 2.8s ease-in-out infinite;
        }

        .boy.right .boy-arm.left-arm {
            left: 10px;
            animation: right-catching-arm 3.1s ease-in-out infinite;
        }

        .boy.right .boy-arm.right-arm {
            right: 4px;
            animation: right-throwing-arm 3.1s ease-in-out infinite;
        }

        .boy-hand {
            position: absolute;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #d89469;
        }

        .boy.left .boy-hand.left-hand {
            left: 0;
            top: 108px;
            animation: left-throwing-hand 2.8s ease-in-out infinite;
        }

        .boy.left .boy-hand.right-hand {
            right: -1px;
            top: 105px;
            animation: left-catching-hand 2.8s ease-in-out infinite;
        }

        .boy.right .boy-hand.left-hand {
            left: 0;
            top: 108px;
            animation: right-catching-hand 3.1s ease-in-out infinite;
        }

        .boy.right .boy-hand.right-hand {
            right: -1px;
            top: 105px;
            animation: right-throwing-hand 3.1s ease-in-out infinite;
        }

        .boy-leg {
            position: absolute;
            top: 105px;
            width: 19px;
            height: 46px;
            border-radius: 0 0 10px 10px;
            background: #26334d;
        }

        .boy-leg.left-leg {
            left: 26px;
            transform: rotate(5deg);
        }

        .boy-leg.right-leg {
            right: 22px;
            transform: rotate(-8deg);
        }

        .boy-shoe {
            position: absolute;
            top: 140px;
            width: 31px;
            height: 13px;
            border-radius: 14px 14px 5px 5px;
            background: #e7edf7;
            box-shadow: inset 0 -4px 0 #8390a5;
        }

        .boy-shoe.left-shoe {
            left: 15px;
        }

        .boy-shoe.right-shoe {
            right: 9px;
        }

        .boy-caption {
            position: absolute;
            top: -25px;
            left: 0;
            padding: 3px 7px;
            border: 1px solid rgba(255, 219, 157, 0.28);
            border-radius: 5px;
            color: #ffe0af;
            background: rgba(52, 26, 19, 0.8);
            font-size: 0.61rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .boy.left .boy-caption {
            transform: rotate(-5deg);
        }

        .boy.right .boy-caption {
            transform: rotate(5deg);
        }

        @keyframes boy-bounce {
            0%, 100% {
                transform: translateY(0) rotate(-1deg);
            }

            42% {
                transform: translateY(-4px) rotate(1deg);
            }

            58% {
                transform: translateY(-1px) rotate(-1deg);
            }
        }

        @keyframes left-throwing-arm {
            0%, 100% {
                transform: rotate(37deg);
            }

            30% {
                transform: rotate(78deg);
            }

            48% {
                transform: rotate(106deg);
            }

            68% {
                transform: rotate(58deg);
            }
        }

        @keyframes left-catching-arm {
            0%, 100% {
                transform: rotate(-58deg);
            }

            36% {
                transform: rotate(-83deg);
            }

            55% {
                transform: rotate(-108deg);
            }

            76% {
                transform: rotate(-62deg);
            }
        }

        @keyframes right-throwing-arm {
            0%, 100% {
                transform: rotate(-58deg);
            }

            28% {
                transform: rotate(-102deg);
            }

            46% {
                transform: rotate(-78deg);
            }

            70% {
                transform: rotate(-55deg);
            }
        }

        @keyframes right-catching-arm {
            0%, 100% {
                transform: rotate(37deg);
            }

            34% {
                transform: rotate(105deg);
            }

            53% {
                transform: rotate(79deg);
            }

            76% {
                transform: rotate(42deg);
            }
        }

        @keyframes left-throwing-hand {
            0%, 100% {
                transform: translate(0, 0);
            }

            30% {
                transform: translate(21px, -17px);
            }

            48% {
                transform: translate(30px, -27px);
            }

            68% {
                transform: translate(10px, -8px);
            }
        }

        @keyframes left-catching-hand {
            0%, 100% {
                transform: translate(0, 0);
            }

            36% {
                transform: translate(-6px, -10px);
            }

            55% {
                transform: translate(-12px, -19px);
            }

            76% {
                transform: translate(-2px, -5px);
            }
        }

        @keyframes right-throwing-hand {
            0%, 100% {
                transform: translate(0, 0);
            }

            28% {
                transform: translate(-25px, -20px);
            }

            46% {
                transform: translate(-15px, -10px);
            }

            70% {
                transform: translate(0, 0);
            }
        }

        @keyframes right-catching-hand {
            0%, 100% {
                transform: translate(0, 0);
            }

            34% {
                transform: translate(15px, -22px);
            }

            53% {
                transform: translate(25px, -12px);
            }

            76% {
                transform: translate(5px, -3px);
            }
        }

        /* Rogue cursor */
        .rogue-cursor {
            position: fixed;
            z-index: 50;
            left: 18vw;
            top: 34vh;
            width: 30px;
            height: 41px;
            pointer-events: none;
            filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.55));
            animation: rogue-roam 18s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .rogue-cursor::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(
                4% 0%,
                94% 65%,
                57% 68%,
                76% 99%,
                60% 100%,
                42% 70%,
                18% 94%
            );
            background: #ffffff;
        }

        .rogue-cursor::after {
            content: "";
            position: absolute;
            inset: 3px 3px 4px 4px;
            clip-path: polygon(
                4% 0%,
                94% 65%,
                57% 68%,
                76% 99%,
                60% 100%,
                42% 70%,
                18% 94%
            );
            background: linear-gradient(145deg, #ff5b5b, #8e2de2);
        }

        .rogue-cursor-label {
            position: absolute;
            top: -23px;
            left: 19px;
            padding: 2px 6px;
            border: 1px solid rgba(255, 145, 145, 0.35);
            border-radius: 4px;
            color: #ffc6c6;
            background: rgba(72, 14, 28, 0.82);
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        @keyframes rogue-roam {
            0% {
                left: 14vw;
                top: 30vh;
                transform: rotate(-12deg) scale(0.9);
            }

            12% {
                left: 67vw;
                top: 19vh;
                transform: rotate(18deg) scale(1);
            }

            24% {
                left: 84vw;
                top: 62vh;
                transform: rotate(-25deg) scale(0.82);
            }

            38% {
                left: 57vw;
                top: 78vh;
                transform: rotate(13deg) scale(1.08);
            }

            51% {
                left: 22vw;
                top: 68vh;
                transform: rotate(-18deg) scale(0.86);
            }

            66% {
                left: 7vw;
                top: 49vh;
                transform: rotate(27deg) scale(1);
            }

            79% {
                left: 31vw;
                top: 13vh;
                transform: rotate(-8deg) scale(0.8);
            }

            91% {
                left: 78vw;
                top: 38vh;
                transform: rotate(21deg) scale(1.05);
            }

            100% {
                left: 14vw;
                top: 30vh;
                transform: rotate(-12deg) scale(0.9);
            }
        }

        /* Magical puff following the user's cursor */
        .magic-puff {
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.35s ease;
        }

        .magic-puff.visible {
            opacity: 1;
        }

        .magic-puff span {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow:
                0 0 7px #ffffff,
                0 0 14px #8ec5ff;
            transform: translate(-50%, -50%);
            animation: puff-spark 1.1s ease-out infinite;
        }

        .magic-puff span:nth-child(1) {
            --x: -18px;
            --y: -12px;
            background: #8ec5ff;
        }

        .magic-puff span:nth-child(2) {
            --x: 17px;
            --y: -9px;
            background: #d6a5ff;
            animation-delay: -0.22s;
        }

        .magic-puff span:nth-child(3) {
            --x: 18px;
            --y: 14px;
            background: #ffd166;
            animation-delay: -0.44s;
        }

        .magic-puff span:nth-child(4) {
            --x: -15px;
            --y: 17px;
            background: #ff91c8;
            animation-delay: -0.66s;
        }

        .magic-puff span:nth-child(5) {
            --x: 0;
            --y: -20px;
            background: #9effc2;
            animation-delay: -0.88s;
        }

        @keyframes puff-spark {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.15);
            }
        }

        /* QR section */
        .qr-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: fit-content;
            margin: 0 auto;
            padding: 12px 16px 12px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
        }

        .qr-link {
            display: block;
            line-height: 0;
            border-radius: 10px;
        }

        .qr-image {
            width: 94px;
            height: 94px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .qr-link:hover .qr-image {
            transform: rotate(3deg) scale(1.05);
            box-shadow: 0 0 22px rgba(90, 162, 255, 0.35);
        }

        .qr-copy {
            text-align: left;
        }

        .qr-copy strong {
            display: block;
            margin-bottom: 3px;
            color: #e9eef8;
            font-size: 0.92rem;
        }

        .qr-text {
            color: #8993a6;
            font-size: 0.8rem;
        }

        /* Scroll cue */
        .scroll-cue {
            position: absolute;
            left: 50%;
            bottom: 20px;
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #758096;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            transform: translateX(-50%);
        }

        .scroll-cue:hover {
            color: #c2d6ff;
        }

        .scroll-track {
            position: relative;
            width: 25px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
        }

        .scroll-track::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 8px;
            width: 5px;
            height: 9px;
            border-radius: 5px;
            background: #ffffff;
            box-shadow: 0 0 10px #80b8ff;
            transform: translateX(-50%);
            animation: scroll-wheel 1.8s ease-in-out infinite;
        }

        .scroll-cursor {
            position: absolute;
            right: -12px;
            bottom: -10px;
            width: 18px;
            height: 25px;
            filter: drop-shadow(0 0 5px rgba(100, 170, 255, 0.8));
            animation: cursor-scroll 1.8s ease-in-out infinite;
        }

        .scroll-cursor::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(4% 0, 93% 66%, 56% 68%, 74% 100%, 58% 100%, 41% 70%, 19% 93%);
            background: #fff;
        }

        .scroll-cursor::after {
            content: "";
            position: absolute;
            inset: 2px;
            clip-path: polygon(4% 0, 93% 66%, 56% 68%, 74% 100%, 58% 100%, 41% 70%, 19% 93%);
            background: #5a9df8;
        }

        @keyframes scroll-wheel {
            0%, 100% {
                transform: translate(-50%, 0);
                opacity: 1;
            }

            55% {
                transform: translate(-50%, 13px);
                opacity: 0.2;
            }
        }

        @keyframes cursor-scroll {
            0%, 100% {
                transform: translateY(0) rotate(-8deg);
            }

            55% {
                transform: translateY(14px) rotate(-8deg);
            }
        }

        /* Instructions page */
        .install-section {
            position: relative;
            isolation: isolate;
            padding: 112px 24px 120px;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 30%),
                rgba(5, 7, 12, 0.46);
        }

        .install-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -3;
            opacity: 0.72;
            background:
                linear-gradient(rgba(90, 162, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(90, 162, 255, 0.06) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
        }

        .install-section::after {
            content: "";
            position: absolute;
            top: 50px;
            right: -110px;
            z-index: -2;
            width: 440px;
            height: 440px;
            border: 1px solid rgba(90, 162, 255, 0.14);
            border-radius: 50%;
            box-shadow:
                0 0 0 28px rgba(90, 162, 255, 0.035),
                0 0 0 57px rgba(90, 162, 255, 0.025),
                0 0 0 86px rgba(90, 162, 255, 0.018);
        }

        .control-orbit {
            position: absolute;
            top: 155px;
            right: 80px;
            z-index: -1;
            width: 270px;
            height: 270px;
            border: 1px dashed rgba(116, 177, 255, 0.2);
            border-radius: 50%;
            animation: orbit-spin 28s linear infinite;
        }

        .control-orbit::before,
        .control-orbit::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #5aa2ff;
            box-shadow: 0 0 16px #5aa2ff;
        }

        .control-orbit::before {
            top: 18px;
            left: 48px;
        }

        .control-orbit::after {
            right: 25px;
            bottom: 52px;
            background: #ef6b7f;
            box-shadow: 0 0 16px #ef6b7f;
        }

        @keyframes orbit-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .factory-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 36px;
            z-index: -1;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(90, 162, 255, 0.24),
                transparent
            );
        }

        .factory-line::before,
        .factory-line::after {
            content: "";
            position: absolute;
            top: -3px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #67aaff;
            box-shadow: 0 0 13px #67aaff;
            animation: conveyor-dot 7s linear infinite;
        }

        .factory-line::before {
            left: 12%;
        }

        .factory-line::after {
            left: 58%;
            animation-delay: -3.5s;
        }

        @keyframes conveyor-dot {
            0% {
                transform: translateX(0);
                opacity: 0;
            }

            10%, 85% {
                opacity: 1;
            }

            100% {
                transform: translateX(260px);
                opacity: 0;
            }
        }

        .section-heading {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 0 auto 58px;
            text-align: center;
        }

        .section-kicker {
            margin-bottom: 11px;
            color: #72adff;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .section-title {
            margin-bottom: 14px;
            color: #ffffff;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 760;
            letter-spacing: -0.045em;
            line-height: 1.05;
        }

        .section-intro {
            color: var(--muted);
            font-size: 1.02rem;
        }

        .steps-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .step {
            position: relative;
            min-height: 300px;
            padding: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background:
                linear-gradient(145deg, rgba(50, 104, 201, 0.15), rgba(255, 255, 255, 0.025)),
                rgba(12, 16, 26, 0.82);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        .step::before {
            content: "";
            position: absolute;
            top: 0;
            left: 28px;
            right: 28px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5aa2ff, transparent);
            opacity: 0.55;
        }

        .step::after {
            content: "";
            position: absolute;
            right: -35px;
            bottom: -50px;
            width: 140px;
            height: 140px;
            border: 1px solid rgba(90, 162, 255, 0.13);
            border-radius: 50%;
        }

        .step:hover {
            border-color: rgba(90, 162, 255, 0.45);
            background:
                linear-gradient(145deg, rgba(50, 104, 201, 0.22), rgba(255, 255, 255, 0.04)),
                rgba(12, 16, 26, 0.92);
            transform: translateY(-7px);
        }

        .step-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: white;
            background: linear-gradient(135deg, #5da7ff, #236ee8);
            box-shadow: 0 10px 24px rgba(35, 110, 232, 0.28);
            font-size: 1.25rem;
            font-weight: 800;
        }

        .step-title {
            margin-bottom: 12px;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 750;
        }

        .step-description {
            position: relative;
            z-index: 1;
            color: #a8b1c0;
            font-size: 0.94rem;
            line-height: 1.75;
        }

        .step-description strong {
            color: #edf3ff;
        }

        .step-description code {
            padding: 3px 6px;
            border: 1px solid rgba(90, 162, 255, 0.2);
            border-radius: 5px;
            color: #9fc7ff;
            background: rgba(90, 162, 255, 0.1);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.85em;
        }

        .step-icon {
            position: absolute;
            top: 31px;
            right: 25px;
            color: rgba(145, 190, 255, 0.27);
            font-size: 1.7rem;
        }

        /* Footer */
        footer {
            padding: 55px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            color: #7e8797;
            text-align: center;
            background: rgba(4, 6, 10, 0.72);
        }

        .footer-text {
            margin-bottom: 9px;
            font-size: 0.9rem;
        }

        .footer-link {
            color: #83b9ff;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        :focus-visible {
            outline: 3px solid #8bc1ff;
            outline-offset: 4px;
        }

        @media (max-width: 900px) {
            .control-orbit {
                right: -80px;
                opacity: 0.6;
            }
        }

        @media (max-width: 800px) {
            .steps-grid {
                grid-template-columns: 1fr;
            }

            .step {
                min-height: auto;
            }

            .cursor-icon-7,
            .cursor-icon-8 {
                display: none;
            }

            .control-orbit {
                top: 360px;
                right: -130px;
                transform: scale(0.75);
            }
        }

        @media (max-width: 640px) {
            .container {
                width: min(100% - 32px, 1100px);
            }

            .hero {
                min-height: 820px;
                padding: 72px 16px 95px;
            }

            h1 {
                font-size: clamp(2.65rem, 14vw, 4rem);
            }

            .hero-subtitle {
                font-size: 0.98rem;
            }

            .button-group {
                flex-direction: column;
                align-items: stretch;
                width: min(100%, 340px);
                margin-right: auto;
                margin-left: auto;
            }

            .button {
                width: 100%;
            }

            .qr-section {
                transform: scale(0.94);
            }

            .carpet-scene {
                height: 200px;
                transform: scale(0.78);
                transform-origin: top center;
            }

            .boy.left {
                left: -1%;
            }

            .boy.right {
                right: -1%;
            }

            .cursor-icon,
            .rocket-cursor.r5 {
                display: none;
            }

            .install-section {
                padding-right: 16px;
                padding-left: 16px;
            }

            .control-orbit {
                top: 420px;
                right: -165px;
                opacity: 0.35;
            }

            .factory-line {
                bottom: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .rogue-cursor,
            .magic-puff,
            .control-orbit {
                display: none;
            }
        }
    </style>
</head>
